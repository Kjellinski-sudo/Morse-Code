<!doctype html>
<html lang="de" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MorseLink</title>
  <meta name="description" content="Morsecode lernen, üben und funken – offline, ohne Registrierung.">
  <meta name="theme-color" content="#060a12">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MorseLink">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div id="app">
    <header class="top">
      <div class="brand">
        <svg viewBox="0 0 40 40" class="logo" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/><circle cx="11" cy="20" r="2.6" fill="var(--cyan)"/><rect x="16" y="17.4" width="13" height="5.2" rx="2.6" fill="var(--mag)"/></svg>
        <div><b>MORSE<span>LINK</span></b><small class="mono"><i class="led"></i><span id="hdr-status">READY</span> · <span id="hdr-lvl"></span> · <span id="hdr-wpm"></span></small></div>
      </div>
      <svg class="wave" viewBox="0 0 200 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0 12h30l4-9 6 18 5-14 4 5h20l4-8 6 16 5-12 4 4h30l4-9 6 18 5-14 4 5h30" /></svg>
      <button id="sos-open" class="sos-chip mono" type="button">SOS</button>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" role="tablist" aria-label="Navigation"></nav>
  </div>
  <div id="sheet" class="sheet"></div>
  <div id="sos" class="sos"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="js/core.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
